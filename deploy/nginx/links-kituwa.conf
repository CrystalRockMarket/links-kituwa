# links.kituwa.com — encrypted short links.
# Protocol 1 rule 7: the host serves, the worker builds. No access log: this
# service does not record who opened a link, so the proxy must not either.
server {
    listen 80;
    listen [::]:80;
    server_name links.kituwa.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name links.kituwa.com;

    ssl_certificate     /etc/letsencrypt/live/links.kituwa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/links.kituwa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:links_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 64k;

    # No access log anywhere on this host. Error log at crit only, so a routine
    # 404 does not write a client address to disk.
    access_log off;
    error_log /var/log/nginx/links-error.log crit;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://127.0.0.1:8891;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
