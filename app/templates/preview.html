{% extends "recipient_base.html" %}
{% block title %}Open link{% endblock %}
{% block body %}
<div class="glyph" aria-hidden="true">↗</div>
<h1>This link is ready</h1>
<p class="muted">Opening it may use one of its remaining uses. If you were only previewing, you can close this page and spend nothing.</p>
<p style="margin-top:1.1rem"><a class="btn btn-primary" href="{{ url_for('open_link', code=code) }}?go=1">Continue</a></p>
<p class="hint">Preview fetches are never counted.</p>
{% endblock %}
