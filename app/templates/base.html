<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Links{% endblock %} · kituwa.com</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="bar">
  <a class="brand" href="{{ url_for('home') }}">links<span>.kituwa</span></a>
  <nav>
    {% if g.account %}
      <a href="{{ url_for('app_home') }}">Links</a>
      <a href="{{ url_for('settings_page') }}">Settings</a>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="linkish" type="submit">Sign out</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Sign in</a>
      <a class="cta" href="{{ url_for('signup') }}">Create account</a>
    {% endif %}
  </nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer class="foot">
  <span>links.kituwa.com</span>
  <span>Short links that expire by use.</span>
</footer>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
