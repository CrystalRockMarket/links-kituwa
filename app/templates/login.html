{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="panel narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <p><a class="cta big" href="{{ url_for('member_login') }}">Sign in with Pocket ID</a></p>
  <p class="muted">One click with your passkey — no password to remember.</p>
  <p class="muted">or use your email and password</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Email <input type="email" name="email" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="cta" type="submit">Sign in</button>
  </form>
  <p class="muted">No account? <a href="{{ url_for('signup') }}">Create one</a>.</p>
</div>
{% endblock %}
