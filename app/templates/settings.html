{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block section %}Account{% endblock %}
{% block crumb %}Settings{% endblock %}
{% block body %}
<section class="card card-pad narrow">
  <h1>Account</h1>
  <form method="post" class="stack" class="mt-xs">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Contact email <input type="email" name="notify_email" value="{{ g.account['email'] }}" autocomplete="email"></label>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
  <p class="hint mt">The service no longer sends alerts: there is no
    click data to alert on.</p>
</section>
{% endblock %}
