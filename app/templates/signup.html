{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block body %}
<div class="panel narrow">
  <h1>Create account</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Email <input type="email" name="email" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
    <p class="hint">At least 12 characters. We email a confirmation link; it expires in two days.</p>
    <button class="cta" type="submit">Create account</button>
  </form>
</div>
{% endblock %}
