{% extends "recipient_base.html" %}
{% block title %}Continue{% endblock %}
{% block body %}
<div class="glyph" aria-hidden="true">◎</div>
<h1>Tracking link</h1>
<p class="muted">This link can be opened by anyone, any number of times. The sender sees that it was opened.</p>
<p style="margin-top:1.1rem"><a class="btn btn-primary" href="{{ url_for('open_link', code=code) }}?go=1">Continue to the page</a></p>
<p style="margin-top:.8rem">
  <button type="button" class="btn btn-sm" data-share="{{ url_for('share_link', code=code) }}">Pass this link on</button>
</p>
<p><input id="shareout" class="mono" readonly hidden></p>
{% endblock %}
